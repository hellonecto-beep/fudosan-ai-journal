name: Daily Publish

# 毎朝 00:00 UTC = 09:00 JST にdraft記事を1本ずつ公開する。
# GitHub Actions の cron はベストエフォート（数分〜数十分ズレる場合あり）。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit+push に必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Promote next draft to published
        id: promote
        run: node .github/scripts/publish-next.cjs | tee /tmp/publish.log

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            published_file=$(git status --porcelain | awk '/^ M / { print $2 }' | head -n1)
            git commit -m "chore: publish next article from queue (${published_file})"
            git push
            echo "✅ Published and pushed."
          else
            echo "ℹ️ No draft articles to publish."
          fi
