name: Daily Publish

# 1日おきに draft 記事を1本ずつ公開する。
# cron '0 0 */2 * *' = UTC 00:00（=JST 09:00）に、暦日が奇数の日だけ実行。
# → 実質「1日おき」の公開になる（月替わりで稀に連日になる場合あり）。
# GitHub Actions の cron はベストエフォート（数分〜数十分ズレる場合あり）。
# 手動で今すぐ公開したい時は workflow_dispatch（Actions画面の Run workflow）を使う。
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit+push に必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Promote next draft to published
        id: promote
        run: node .github/scripts/publish-next.cjs | tee /tmp/publish.log

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git diff --name-only | head -n1)
          if [[ -n "$changed" ]]; then
            git add -A
            git commit -m "chore: publish next article from queue (${changed})"
            git push
            echo "✅ Published: ${changed}"
          else
            echo "ℹ️ No draft articles to publish."
          fi
